<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Serie A 2026/27 forecast</title>
<meta name="description" content="Bayesian forecast of the Serie A 2026/27 final table: expected points, title, top-4 and relegation probabilities.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Source+Sans+3:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f3f6f4; --surface:#ffffff; --ink:#13201a; --muted:#56655d; --faint:#8a968f;
  --rule:#dde4e0; --grid:#e6ebe8; --pitch:#1d6a44;
  --s1:#2a78d6; --s1-soft:#9ec5f4; --s2:#eb6834;
  --ucl:#2a78d6; --rel:#d03b3b;
  --h0:#f3f6f4; --h1:#cde2fb; --h2:#9ec5f4; --h3:#6da7ec; --h4:#3987e5; --h5:#256abf; --h6:#184f95; --h7:#0d366b;
  --cell-ink-dark:#13201a; --cell-ink-light:#ffffff;
  --tip-bg:#13201a; --tip-ink:#ffffff;
  --display:"Barlow Condensed","Arial Narrow",Arial,sans-serif;
  --body:"Source Sans 3","Segoe UI",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#101513; --surface:#171e1a; --ink:#e5ebe7; --muted:#a3b0a8; --faint:#76837b;
    --rule:#2a332e; --grid:#232b27; --pitch:#63c08e;
    --s1:#3987e5; --s1-soft:#1c5cab; --s2:#d95926;
    --ucl:#3987e5; --rel:#e66767;
    --h0:#171e1a; --h1:#10304f; --h2:#104281; --h3:#184f95; --h4:#1c5cab; --h5:#2a78d6; --h6:#5598e7; --h7:#9ec5f4;
    --cell-ink-dark:#101513; --cell-ink-light:#e5ebe7;
    --tip-bg:#e5ebe7; --tip-ink:#101513;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#101513; --surface:#171e1a; --ink:#e5ebe7; --muted:#a3b0a8; --faint:#76837b;
  --rule:#2a332e; --grid:#232b27; --pitch:#63c08e;
  --s1:#3987e5; --s1-soft:#1c5cab; --s2:#d95926;
  --ucl:#3987e5; --rel:#e66767;
  --h0:#171e1a; --h1:#10304f; --h2:#104281; --h3:#184f95; --h4:#1c5cab; --h5:#2a78d6; --h6:#5598e7; --h7:#9ec5f4;
  --cell-ink-dark:#101513; --cell-ink-light:#e5ebe7;
  --tip-bg:#e5ebe7; --tip-ink:#101513;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.5}
.wrap{max-width:1080px;margin:0 auto;padding-inline:20px;padding-block:32px 48px;display:flex;flex-direction:column;gap:40px}
header{display:flex;flex-direction:column;gap:10px}
.kicker{font-family:var(--display);font-weight:600;font-size:18px;color:var(--pitch);letter-spacing:.02em}
h1{font-family:var(--display);font-weight:700;font-size:clamp(40px,7vw,68px);line-height:.95;margin:0;text-wrap:balance}
.lead{font-size:19px;max-width:68ch;margin:0}
.meta{color:var(--muted);font-size:14px;margin:0}
h2{font-family:var(--display);font-weight:600;font-size:30px;line-height:1.05;margin:0;text-wrap:balance}
section{display:flex;flex-direction:column;gap:14px}
section>p{margin:0;max-width:70ch;color:var(--muted)}
.card{background:var(--surface);border:1px solid var(--rule);border-radius:10px;overflow-x:auto}
table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums}
th{font-family:var(--display);font-weight:600;font-size:15px;color:var(--muted);text-align:right;padding:10px 10px 8px;white-space:nowrap;border-bottom:1px solid var(--rule);vertical-align:bottom}
td{padding:7px 10px;text-align:right;border-bottom:1px solid var(--grid);white-space:nowrap}
tr:last-child td{border-bottom:0}
th.l,td.l{text-align:left}
.pos{display:inline-grid;place-items:center;width:26px;height:22px;border-radius:5px;font-family:var(--display);font-weight:600;font-size:15px;color:var(--muted)}
.pos.ucl{background:var(--ucl);color:#fff}
.pos.rel{background:var(--rel);color:#fff}
.team{font-weight:600}
.sub{color:var(--muted);font-size:13px}
.strip{width:100%;min-width:220px}
td.stripcell{width:38%;padding-block:4px}
.pct{min-width:54px}
.pct .bar{display:block;height:3px;border-radius:2px;background:var(--s1);margin-top:3px;margin-left:auto}
.zero{color:var(--faint)}
.legend{display:flex;flex-wrap:wrap;gap:8px 20px;align-items:center;color:var(--muted);font-size:14px;padding:12px 14px;border-top:1px solid var(--rule)}
.key{display:inline-flex;align-items:center;gap:7px}
.sw{display:inline-block;width:14px;height:14px;border-radius:4px}
.line{display:inline-block;width:18px;height:4px;border-radius:2px}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%}
.heat td,.heat th{padding:0;border:0}
.heat th{font-size:13px;padding:6px 0 4px;text-align:center;min-width:30px}
.heat th.l{text-align:left;padding-left:12px;padding-right:10px}
.heat td.l{padding:0 10px 0 12px;font-size:14px}
.heat td.c{width:34px;height:26px;text-align:center;font-size:11.5px;border:1px solid var(--surface);cursor:default}
.heat td.c:hover,.heat td.c:focus{outline:2px solid var(--ink);outline-offset:-2px}
.heat tr.sep td{height:6px}
.scale{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--muted)}
.scale .ramp{display:flex;flex-wrap:wrap;gap:2px}
.scale .ramp>span{min-width:52px}
.scale .ramp>span>span:last-child{white-space:nowrap}
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:24px}
.track td,.track th{padding:8px 12px}
.track td.l{font-weight:600}
a{color:var(--s1)}
.links{display:flex;flex-wrap:wrap;gap:8px 18px;font-size:15px}
.note{background:var(--surface);border:1px solid var(--rule);border-radius:10px;padding:18px 20px;display:flex;flex-direction:column;gap:8px}
.note h3{font-family:var(--display);font-weight:600;font-size:21px;margin:0}
.note p{margin:0;color:var(--muted);font-size:15px}
.note dl{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;margin:4px 0 0;font-size:15px}
.note dt{font-variant-numeric:tabular-nums;font-weight:600}
.note dd{margin:0;color:var(--muted)}
#tip{position:fixed;pointer-events:none;background:var(--tip-bg);color:var(--tip-ink);padding:8px 10px;border-radius:7px;font-size:13.5px;line-height:1.35;max-width:260px;z-index:10;opacity:0;transition:opacity .12s}
#tip b{font-size:15px}
svg text{font-family:var(--body)}
:focus-visible{outline:2px solid var(--s1);outline-offset:2px}
@media (max-width:640px){ .lead{font-size:17px} h2{font-size:26px} td,th{padding-inline:7px} }
@media (prefers-reduced-motion:reduce){ #tip{transition:none} }
</style>
</head>
<body>
__BODY__
</body>
</html>
